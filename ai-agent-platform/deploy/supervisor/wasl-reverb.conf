; Laravel Reverb websocket server (proxied by nginx on 443 /app).

[program:wasl-reverb]
command=php /var/www/ai_agent/wasl/ai-agent-platform/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/ai_agent/wasl/ai-agent-platform
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/ai_agent/wasl/ai-agent-platform/storage/logs/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
