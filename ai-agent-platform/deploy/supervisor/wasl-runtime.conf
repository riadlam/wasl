; Python AI agent runtime (FastAPI / uvicorn) for AI_RUNTIME=sk.

[program:wasl-runtime]
command=/var/www/ai_agent/wasl/ai-agent-runtime/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8090 --workers 1
directory=/var/www/ai_agent/wasl/ai-agent-runtime
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/ai_agent/wasl/ai-agent-runtime/logs/uvicorn.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
