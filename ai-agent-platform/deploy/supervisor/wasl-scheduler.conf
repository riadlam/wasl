; Laravel scheduler. Runs campaigns:dispatch-due every five minutes and writes the
; heartbeat checked by GET /api/health/queue. Run exactly one of these per cluster.

[program:wasl-scheduler]
command=php /var/www/ai_agent/wasl/ai-agent-platform/artisan schedule:work
directory=/var/www/ai_agent/wasl/ai-agent-platform
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/ai_agent/wasl/ai-agent-platform/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
