; Queue workers for Wasl. Campaign slots run on their own queue so a burst of
; campaign drafting never delays webhooks, inbox replies or image jobs.

[program:wasl-worker-campaigns]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ai_agent/wasl/ai-agent-platform/artisan queue:work --queue=campaigns --sleep=3 --tries=3 --timeout=620 --max-time=3600
directory=/var/www/ai_agent/wasl/ai-agent-platform
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=650
redirect_stderr=true
stdout_logfile=/var/www/ai_agent/wasl/ai-agent-platform/storage/logs/worker-campaigns.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:wasl-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ai_agent/wasl/ai-agent-platform/artisan queue:work --queue=webhooks,social,ai,default --sleep=3 --tries=3 --timeout=300 --max-time=3600
directory=/var/www/ai_agent/wasl/ai-agent-platform
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=320
redirect_stderr=true
stdout_logfile=/var/www/ai_agent/wasl/ai-agent-platform/storage/logs/worker-default.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
